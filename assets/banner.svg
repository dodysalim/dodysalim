<rect x="68" y="132" width="26" height="104" rx="4"><animate attributeName="height" values="20;104;104" keyTimes="0;.45;1" dur="2.4s" fill="freeze"/><animate attributeName="y" values="216;132;132" keyTimes="0;.45;1" dur="2.4s" fill="freeze"/></rect>
