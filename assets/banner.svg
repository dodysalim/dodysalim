<rect x="188" y="138" width="26" height="98" rx="4"><animate attributeName="height" values="20;98;98" keyTimes="0;.6;1" dur="2.4s" fill="freeze"/><animate attributeName="y" values="216;138;138" keyTimes="0;.6;1" dur="2.4s" fill="freeze"/></rect>
