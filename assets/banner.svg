<path d="M240 214 L268 190 L294 198 L320 150 L348 128" fill="none" stroke="url(#ac)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="200" stroke-dashoffset="200"><animate attributeName="stroke-dashoffset" values="200;0" dur="2.6s" fill="freeze"/></path>
