<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Dody Dueñas Remache — Analista de Datos y Data Scientist. Python, SQL, Power BI, Machine Learning.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1222"/><stop offset="1" stop-color="#151029"/></linearGradient>
<linearGradient id="ac" x1="0" x2="1"><stop stop-color="#75e6ce"/><stop offset=".55" stop-color="#88b7ff"/><stop offset="1" stop-color="#c99bff"/></linearGradient>
<linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#75e6ce" stop-opacity=".35"/><stop offset="1" stop-color="#88b7ff"/></linearGradient>
<radialGradient id="glow1"><stop stop-color="#75e6ce" stop-opacity=".35"/><stop offset="1" stop-color="#75e6ce" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2"><stop stop-color="#8f7bff" stop-opacity=".35"/><stop offset="1" stop-color="#8f7bff" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
<clipPath id="r"><rect width="1200" height="360" rx="24"/></clipPath>
</defs>
<g clip-path="url(#r)">
<rect width="1200" height="360" fill="url(#bg)"/>
<rect width="1200" height="360" fill="url(#grid)"/>
<circle cx="140" cy="40" r="260" fill="url(#glow1)"><animate attributeName="cx" values="140;260;140" dur="14s" repeatCount="indefinite"/></circle>
<circle cx="1080" cy="340" r="300" fill="url(#glow2)"><animate attributeName="cy" values="340;250;340" dur="16s" repeatCount="indefinite"/></circle>

